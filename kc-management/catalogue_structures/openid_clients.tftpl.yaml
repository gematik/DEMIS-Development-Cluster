# Default clients that are created by Keycloak and should be imported into Terraform state if not excluded
account:
  name: "$${client_account}"
  access_type: "CONFIDENTIAL"
  standard_flow_enabled: true
  valid_redirect_uris: ["/realms/${realm}/account/*"]
  defaultClient: true
  full_scope_allowed: false
  SURVEILLANCE-PROGRAMS:
    access_type: "PUBLIC"
account-console:
  name: "$${client_account-console}"
  access_type: "PUBLIC"
  standard_flow_enabled: true
  pkce_code_challenge_method: "S256"
  valid_redirect_uris: ["/realms/${realm}/account/*"]
  defaultClient: true
  full_scope_allowed: false
admin-cli:
  name: "$${client_admin-cli}"
  access_type: "PUBLIC"
  defaultClient: true
  direct_access_grants_enabled: true
  PORTAL: {}
broker:
  name: "$${client_broker}"
  access_type: "BEARER-ONLY"
  defaultClient: true
  full_scope_allowed: false
  LAB:
    access_type: "CONFIDENTIAL"
    valid_redirect_uris: ["+"]
    standard_flow_enabled: true
  HOSPITAL:
    access_type: "CONFIDENTIAL"
    valid_redirect_uris: ["+"]
    standard_flow_enabled: true
realm-management:
  name: "$${client_realm-management}"
  access_type: "BEARER-ONLY"
  defaultClient: true
  INSTITUTIONS-TI:
    access_type: "CONFIDENTIAL"
    standard_flow_enabled: true
    implicit_flow_enabled: false
    direct_access_grants_enabled: false
    service_accounts_enabled: true
    full_scope_allowed: false
    frontchannel_logout_enabled: false
    allow_remote_resource_management: false
    valid_redirect_uris: ["+"]
    valid_post_logout_redirect_uris: ["+"]
    web_origins: []
    authorization:
      policy_enforcement_mode: "ENFORCING"
      decision_strategy: "UNANIMOUS"
      allow_remote_resource_management: false
      keep_defaults: false
  master:
    defaultClient: false
security-admin-console:
  name: "$${client_security-admin-console}"
  access_type: "PUBLIC"
  standard_flow_enabled: true
  pkce_code_challenge_method: "S256"
  valid_redirect_uris: ["/admin/${realm}/console/*"]
  defaultClient: true
  post_logout_redirect_uris: ["+"]
