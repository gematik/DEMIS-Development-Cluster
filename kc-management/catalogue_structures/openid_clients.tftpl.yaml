testsuite-client:
  name: "Testsuite"
  access_type: "CONFIDENTIAL"
  access_token_lifespan: 600
  frontchannel_logout_enabled: true
  frontend_logout_session_required: true
  service_accounts_enabled: true
token-exchange-client:
  access_type: "CONFIDENTIAL"
  standard_flow_enabled: true
  direct_access_grants_enabled: true
  frontchannel_logout_enabled: true
  valid_redirect_uris: ["/*"]
  valid_post_logout_redirect_uris: ["+"]
  web_origins: ["/*"]
demis-adapter:
  name: "Service Provider demis-adapter"
  access_type: "CONFIDENTIAL"
  standard_flow_enabled: true
  direct_access_grants_enabled: true
  valid_redirect_uris:
    - "de.fraunhofer.fokus.ehealth.movi.kaa://oauth/callback"
    - "de.fraunhofer.fokus.ehealth.ask.keycloakauthenticatortest://oauth/callback"
  valid_post_logout_redirect_uris: ["+"]
demis-gateway:
  access_type: "CONFIDENTIAL"
  standard_flow_enabled: true
  direct_access_grants_enabled: true
  valid_redirect_uris: ["http://www.example.de/*"]
  valid_post_logout_redirect_uris: ["+"]
  access_token_lifespan: 600
demis-test-password-grant:
  access_type: "PUBLIC"
  standard_flow_enabled: false
  direct_access_grants_enabled: true
  frontchannel_logout_enabled: true
  authentication_flow_binding_overrides:
    direct_grant: "direct grant"
demis-test:
  name: "Service Provider demis-test"
  access_type: "CONFIDENTIAL"
  valid_redirect_uris: ["/*"]
  valid_post_logout_redirect_uris: ["+"]
  standard_flow_enabled: true
  direct_access_grants_enabled: true
  access_token_lifespan: 600
  default_scopes: ["basic", "profile", "roles"]
  optional_scopes: []
notification-gateway:
  name: "Notification Gateway Ressource"
  access_type: "BEARER-ONLY"
  access_token_lifespan: 540
notification-api:
  name: "REST Service: notification-api"
  access_type: "BEARER-ONLY"
notification-entry-service:
  name: "REST Service: notification-entry-service"
  access_type: "BEARER-ONLY"
  access_token_lifespan: 600
### PORTAL Clients
%{ for instance in kc_options.multi_stage_kc ~}
meldeportal${instance.name_suffix}:
  access_type: "PUBLIC"
  standard_flow_enabled: true
  direct_access_grants_enabled: true
  backchannel_logout_session_required: true
  base_url: ${jsonencode(replace(stage_specific_keycloak_config.portal_specifics.demis_home_url, "<STAGE_NAME>", instance.stage_name))}
  admin_url: ${jsonencode(replace(stage_specific_keycloak_config.portal_specifics.demis_home_url, "<STAGE_NAME>", instance.stage_name))}
  valid_redirect_uris: ${jsonencode([for uri in stage_specific_keycloak_config.portal_specifics.meldeportal_redirect_url : replace(uri, "<STAGE_NAME>", instance.stage_name)])}
  valid_post_logout_redirect_uris: ["+"]
  web_origins: ${jsonencode([for origin in stage_specific_keycloak_config.portal_specifics.meldeportal_web_origin : replace(origin, "<STAGE_NAME>", instance.stage_name)])}
meldeportal-internet${instance.name_suffix}:
  access_type: "PUBLIC"
  standard_flow_enabled: true
  direct_access_grants_enabled: true
  backchannel_logout_session_required: true
  base_url: ${jsonencode(replace(coalesce(stage_specific_keycloak_config.portal_specifics.internet_home_url, stage_specific_keycloak_config.portal_specifics.demis_home_url), "<STAGE_NAME>", instance.stage_name))}
  admin_url: ${jsonencode(replace(coalesce(stage_specific_keycloak_config.portal_specifics.internet_home_url, stage_specific_keycloak_config.portal_specifics.demis_home_url), "<STAGE_NAME>", instance.stage_name))}
  valid_redirect_uris: ${jsonencode([for uri in stage_specific_keycloak_config.portal_specifics.meldeportal_internet_redirect_url : replace(uri, "<STAGE_NAME>", instance.stage_name)])}
  valid_post_logout_redirect_uris: ["+"]
  web_origins: ${jsonencode([for origin in stage_specific_keycloak_config.portal_specifics.meldeportal_internet_web_origin : replace(origin, "<STAGE_NAME>", instance.stage_name)])}
%{ endfor ~}

