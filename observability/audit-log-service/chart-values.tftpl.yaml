replicaCount: ${replica_count}

required:
  image:
    repository: ${docker_registry}

imagePullSecrets:
%{ for pull_secret in image_pull_secrets ~}
  - name: ${pull_secret}
%{ endfor ~}

istio:
  extProc:
    enabled: ${fssr_enabled || fssw_enabled}
    port: ${port}
    # Root namespace: the audited workloads live in another namespace than this service
    namespace: ${filter_namespace}
    filters:%{ if !(fssr_enabled || fssw_enabled) } []%{ endif }
%{ if fssr_enabled ~}
      - name: audit-log-service-fssr
        targetWorkload: fhir-storage-reader
        targetNamespace: ${audited_namespace}
        methods:
          - GET
        processingMode:
          requestHeaderMode: SEND
          # A GET carries no body
          requestBodyMode: NONE
          # Carries the ':status' the processor filters on
          responseHeaderMode: SEND
          responseBodyMode: STREAMED
          # Data minimisation: trailers are not part of any audit record
          requestTrailerMode: SKIP
          responseTrailerMode: SKIP
        initialMetadata:
          x-audit-mode: READ
%{ endif ~}
%{ if fssw_enabled ~}
      - name: audit-log-service-fssw
        targetWorkload: fhir-storage-writer
        targetNamespace: ${audited_namespace}
        methods:
          - POST
        processingMode:
          requestHeaderMode: SEND
          # STREAMED: the processor reassembles the chunks itself
          requestBodyMode: STREAMED
          responseHeaderMode: SEND
          responseBodyMode: STREAMED
          requestTrailerMode: SKIP
          responseTrailerMode: SKIP
        initialMetadata:
          x-audit-mode: WRITE
%{ endif ~}
