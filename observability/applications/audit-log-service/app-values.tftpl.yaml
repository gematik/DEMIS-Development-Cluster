# Enables debug mode
debug:
  enable: ${debug_enable}

required:
  image:
    repository: ${docker_registry}
    %{ if strcontains(docker_registry, "gematik1") }
    name: demis-audit-log-service
    %{ endif }

imagePullSecrets:
%{ for pull_secret in image_pull_secrets ~}
  - name: ${pull_secret}
%{ endfor ~}

podAnnotations:
  checksum/fetched-notifications-user-database-secret: "${db_secret_checksum}"
  checksum/fetched-notifications-user-ddl-database-secret: "${db_ddl_secret_checksum}"
  sidecar.istio.io/proxyCPU: ${istio_proxy_resources.requests.cpu}
  sidecar.istio.io/proxyMemory: ${istio_proxy_resources.requests.memory}
  sidecar.istio.io/proxyMemoryLimit: ${istio_proxy_resources.limits.memory}

istio:
  extProc:
    enabled: ${fssr_enabled || fssw_enabled}
    port: ${port}
    # Root namespace: the audited workloads live in other namespaces than this service
    namespace: ${filter_namespace}
    # The filters per layer for each of its audited namespaces (the names are unique in the root namespace)
    filters:%{ if !(fssr_enabled || fssw_enabled) || length(audited_namespaces.demis) == 0 } []%{ endif }
    # demis: fhir-storage-reader and -writer
%{ for audited_namespace in audited_namespaces.demis ~}
%{ if fssr_enabled ~}
      - name: audit-log-service-fssr-${audited_namespace}
        targetWorkload: fhir-storage-reader
        targetNamespace: ${audited_namespace}
        methods:
          - GET
        processingMode:
          requestHeaderMode: SEND
          # A GET carries no body
          requestBodyMode: NONE
          # Carries the ':status' the processor filters on
          responseHeaderMode: SEND
          responseBodyMode: STREAMED
          # Data minimisation: trailers are not part of any audit record
          requestTrailerMode: SKIP
          responseTrailerMode: SKIP
        initialMetadata:
          x-audit-mode: READ
%{ endif ~}
%{ if fssw_enabled ~}
      - name: audit-log-service-fssw-${audited_namespace}
        targetWorkload: fhir-storage-writer
        targetNamespace: ${audited_namespace}
        methods:
          - POST
        processingMode:
          requestHeaderMode: SEND
          # STREAMED: the processor reassembles the chunks itself
          requestBodyMode: STREAMED
          responseHeaderMode: SEND
          responseBodyMode: STREAMED
          requestTrailerMode: SKIP
          responseTrailerMode: SKIP
        initialMetadata:
          x-audit-mode: WRITE
%{ endif ~}
%{ endfor ~}

customEnvVars:
  # Prevents empty values that can delete the default environment variables
  TERRAFORM_DEPLOYMENT: true
  DB_URL: "jdbc:postgresql://pgbouncer.${namespace}.svc.cluster.local:5432/${data_base}"
%{ for flag_name, flag_value in feature_flags ~}
  ${flag_name}: ${flag_value}
%{ endfor ~}
%{ for option_name, option_value in config_options ~}
  ${option_name}: "${option_value}"
%{ endfor ~}

%{ if replica_count != null ~}
# Number of Pod Replicas (resources.tfvars)
replicaCount: ${replica_count}
%{ endif ~}
%{ if resource_block != null ~}
# Override Resource Definitions for Pod (resources.tfvars)
${resource_block}
%{ endif ~}
