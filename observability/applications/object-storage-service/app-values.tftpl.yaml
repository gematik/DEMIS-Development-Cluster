# Object storage of the observability namespace, only used by Loki
required:
  image:
    repository: ${docker_registry}

imagePullSecrets:
%{ for pull_secret in image_pull_secrets ~}
  - name: ${pull_secret}
%{ endfor ~}

podAnnotations:
  checksum/object-storage-service-secret: "${secret_checksum}"
  sidecar.istio.io/proxyCPU: ${istio_proxy_resources.requests.cpu}
  sidecar.istio.io/proxyMemory: ${istio_proxy_resources.requests.memory}
  sidecar.istio.io/proxyMemoryLimit: ${istio_proxy_resources.limits.memory}

istio:
  enable: true

config:
  useDefault: true
  persistence:
    enabled: true
    volumeClaim:
      useDefault: false
      name: ${volume_claim}
    volume:
      useDefault: false
  secrets:
    useDefault: false
    s3:
      name: ${secret_name}
      entries:
        S3_ACCESS_KEY: S3_ACCESS_KEY
        S3_SECRET_KEY: S3_SECRET_KEY

# Loki identity, restricted to its own bucket
bucketIdentities:
  - name: loki
    bucket: ${loki_bucket}
    accessKeyEntry: LOKI_S3_ACCESS_KEY
    secretKeyEntry: LOKI_S3_SECRET_KEY # checkov:skip=CKV_SECRET_6: name of the secret entry, no secret

# No anonymous access: SSE-S3 objects would be returned decrypted
anonymousReadBuckets: []

# SSE-S3: the encryption key is derived from this passphrase
sse:
  passphraseEntry: ${sse_enabled ? "S3_SSE_PASSPHRASE" : "null"}

%{ if length(feature_flags) + length(config_options) > 0 ~}
# Feature flags and config options (feature_flags.tfvars, config_options.tfvars)
customEnvVars:
%{ for flag_name, flag_value in feature_flags ~}
  ${flag_name}: ${flag_value}
%{ endfor ~}
%{ for option_name, option_value in config_options ~}
  ${option_name}: "${option_value}"
%{ endfor ~}
%{ endif ~}

%{ if replica_count != null ~}
# Number of Pod Replicas (resources.tfvars)
replicaCount: ${replica_count}
%{ endif ~}
%{ if resource_block != null ~}
# Override Resource Definitions for Pod (resources.tfvars)
${resource_block}
%{ endif ~}
