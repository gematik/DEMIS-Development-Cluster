# Enables debug mode
debug:
  enable: ${debug_enable}

# Defines the Schedule for the CronJob
cronJobSchedule: "${cron_schedule}"

required:
  image:
    repository: ${docker_registry}
    %{ if strcontains(docker_registry, "gematik1") }
    name: demis-audit-log-purger
    %{ endif }
  suspend: ${suspend}

imagePullSecrets:
%{ for pull_secret in image_pull_secrets ~}
  - name: ${pull_secret}
%{ endfor ~}

customEnvVars:
  # Prevents empty values that can delete the default environment variables
  TERRAFORM_DEPLOYMENT: true
  DB_URL: "jdbc:postgresql://pgbouncer.${namespace}.svc.cluster.local:5432/${data_base}"
%{ for flag_name, flag_value in feature_flags ~}
  ${flag_name}: ${flag_value}
%{ endfor ~}
%{ for option_name, option_value in config_options ~}
  ${option_name}: "${option_value}"
%{ endfor ~}

podAnnotations:
  checksum/fetched-notifications-purger-database-secret: "${db_secret_checksum}"
  sidecar.istio.io/proxyCPU: ${istio_proxy_resources.requests.cpu}
  sidecar.istio.io/proxyMemory: ${istio_proxy_resources.requests.memory}
  sidecar.istio.io/proxyMemoryLimit: ${istio_proxy_resources.limits.memory}

%{ if resource_block != null ~}
# Override Resource Definitions for Pod (resources.tfvars)
${resource_block}
%{ endif ~}
